<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel-2 Swipe Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body { height: 100%; margin: 0; }
  #map { position: absolute; inset: 0; } /* fills page reliably on GH Pages */
  /* Make the slider nice & obvious */
  .leaflet-sbs-range { width: 60% !important; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Use unpkg and a pinned version that’s known to work -->
<script src="https://unpkg.com/leaflet-side-by-side@2.2.0/dist/leaflet-side-by-side.min.js"></script>

<script>
// Sanity check: if this logs 'function', plugin is loaded
console.log('sideBySide type:', typeof L.control.sideBySide);

var map = L.map('map');

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// replace with YOUR bounds
var bounds = [[40.45640682642721, 68.4373932792854], [40.646767386947346, 68.78707240399831]];

var leftImg = L.imageOverlay('Mirzaabad_May_2019.png', bounds).addTo(map);
var rightImg = L.imageOverlay('Mirzaabad_May_2020.png', bounds).addTo(map);

map.fitBounds(bounds);

// Add the slider control
L.control.sideBySide(leftImg, rightImg).addTo(map);
</script>
</body>
</html>
