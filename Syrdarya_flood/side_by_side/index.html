<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before/After Swipe (ImageOverlay, Leaflet Compare)</title>

  <!-- Leaflet core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          onload="console.log('[OK] Leaflet loaded')"
          onerror="console.error('[ERR] Leaflet failed to load')"></script>

  <!-- Leaflet Compare (works with ImageOverlay) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-compare/dist/leaflet-compare.css"/>
  <script defer src="https://unpkg.com/leaflet-compare/dist/leaflet-compare.js"
          onload="console.log('[OK] Leaflet-Compare loaded')"
          onerror="console.error('[ERR] Leaflet-Compare failed to load')"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }
    /* Optional: make the handle easier to grab */
    .leaflet-compare .compare-handle { width: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script defer>
  (function () {
    const ok   = (m, ...a) => console.log('%c' + m, 'color:#0a0;font-weight:bold', ...a);
    const info = (m, ...a) => console.log('%c' + m, 'color:#06c', ...a);
    const warn = (m, ...a) => console.warn('%c' + m, 'color:#b80', ...a);
    const err  = (m, ...a) => console.error('%c' + m, 'color:#c00;font-weight:bold', ...a);

    window.addEventListener('DOMContentLoaded', async () => {
      info('[BOOT] DOMContentLoaded');

      // 1) Sanity: libraries
      if (typeof L === 'undefined') {
        err('[FATAL] Leaflet (L) is undefined — leaflet.js didn’t load.');
        return;
      }
      ok('[OK] Leaflet detected', L.version);

      if (typeof L.control?.compare !== 'function') {
        err('[FATAL] leaflet-compare is not available — check the <script> URL/load order.');
        return;
      }
      ok('[OK] leaflet-compare available');

      // 2) Your files (case-sensitive) — put them next to this HTML
      const LEFT_IMG  = 'Mirzaabad_May_2019.png';
      const RIGHT_IMG = 'Mirzaabad_May_2020.png';
      info('[INFO] Using images:', { LEFT_IMG, RIGHT_IMG });

      // 3) Your geographic bounds in EPSG:4326 as [[south,west],[north,east]]
      const bounds = [[40.45640682642721, 68.4373932792854], [40.646767386947346, 68.78707240399831]];
      ok('[OK] Bounds set', bounds);

      // 4) Preflight image reachability (helps catch 404s early)
      const check = (src) => new Promise(res => {
        const i = new Image();
        i.onload = () => { ok(`[OK] Image reachable: ${src} (${i.naturalWidth}x${i.naturalHeight})`); res(true); };
        i.onerror = () => { err(`[ERR] Image failed to load: ${src}`); res(false); };
        i.src = src + '?cachebust=' + Date.now();
      });
      const [okL, okR] = await Promise.all([check(LEFT_IMG), check(RIGHT_IMG)]);
      if (!okL || !okR) {
        err('[FATAL] Fix the missing image(s) and reload.');
        return;
      }

      // 5) Create map + basemap
      const map = L.map('map');
      ok('[OK] Map created');

      const base = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      base.on('load', () => ok('[OK] Base tiles loaded'));
      base.on('tileerror', (e) => warn('[WARN] Base tile error', e));

      // 6) Create the image overlays (ImageOverlay works with leaflet-compare)
      const leftOverlay  = L.imageOverlay(LEFT_IMG, bounds);
      const rightOverlay = L.imageOverlay(RIGHT_IMG, bounds);
      leftOverlay.on('load',  () => ok('[OK] Left image overlay rendered'));
      rightOverlay.on('load', () => ok('[OK] Right image overlay rendered'));
      leftOverlay.on('error',  () => err('[ERR] Left image overlay failed (bounds or file?)'));
      rightOverlay.on('error', () => err('[ERR] Right image overlay failed (bounds or file?)'));

      // 7) Fit the map and add overlays
      map.fitBounds(bounds);
      ok('[OK] fitBounds applied');
      leftOverlay.addTo(map);
      rightOverlay.addTo(map);

      // 8) Add the compare (swipe) control
      try {
        // position: 0.5 starts the handle in the middle; set 0..1 if you want a different start
        L.control.compare([leftOverlay], [rightOverlay], { position: 0.5 }).addTo(map);
        ok('[OK] Compare control added — drag the vertical handle to swipe');
      } catch (e) {
        err('[ERR] Failed to add compare control', e);
      }

      info('[DONE] If anything is blank: check Network tab for 404s on leaflet.js, leaflet-compare.js, and both PNGs.');
    });
  })();
  </script>
</body>
</html>
