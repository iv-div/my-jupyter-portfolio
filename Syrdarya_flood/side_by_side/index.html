<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaflet Compare — Big Handle, No Map Move</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Compare (npm dist build) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-compare/dist/leaflet-compare.css"/>
  <script src="https://unpkg.com/leaflet-compare/dist/leaflet-compare.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { position: absolute; inset: 0; }

    /* 2× thicker handle + easy to grab */
    .leaflet-compare .compare-handle {
      width: 36px;                      /* was ~18px → now 2× */
      background: rgba(255,255,255,0.95);
      border: 1px solid #888;
      box-shadow: 0 0 0 1px #666 inset, 0 0 10px rgba(0,0,0,0.25);
      cursor: ew-resize;
      z-index: 10000;
      touch-action: none;               /* prevent browser gestures on touch */
      user-select: none;
      pointer-events: auto;
    }
    /* Make sure the compare band itself can catch events */
    .leaflet-compare .compare { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
  (function () {
    // --- Your inputs ---
    const bounds = [[40.45640682642721, 68.4373932792854], [40.646767386947346, 68.78707240399831]];
    const LEFT_IMG  = 'Mirzaabad_May_2019.png';
    const RIGHT_IMG = 'Mirzaabad_May_2020.png';

    // --- Map ---
    const map = L.map('map', {
      zoomControl: false,     // optional: remove +/− UI
      dragging: false,        // hard-disable panning
      scrollWheelZoom: false, // disable wheel zoom
      doubleClickZoom: false, // disable dblclick zoom
      boxZoom: false,         // disable box zoom
      touchZoom: false,       // disable pinch zoom
      keyboard: false         // disable keyboard nav
    });

    // If you still want a basemap visible, add it (it won’t move)
    const leftBase  = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    });
    const rightBase = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    });

    // Two panes so each side has its own stack (matches plugin demo)
    map.createPane('left');
    map.createPane('right');

    // Image overlays pinned to panes
    const leftOverlay  = L.imageOverlay(LEFT_IMG,  bounds, { pane: 'left' });
    const rightOverlay = L.imageOverlay(RIGHT_IMG, bounds, { pane: 'right' });

    // Add layers
    leftBase.addTo(map);
    rightBase.addTo(map);
    leftOverlay.addTo(map);
    rightOverlay.addTo(map);

    // Fit once (map can't be dragged anyway)
    map.fitBounds(bounds);

    // Compare control with big handle
    L.control.compare(
      [leftBase, leftOverlay],
      [rightBase, rightOverlay],
      { position: 0.5 } // start centered
    ).addTo(map);
  })();
  </script>
</body>
</html>
